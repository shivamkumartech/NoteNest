<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  width="1200"
  height="630"
>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />

    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Header -->
  <g transform="translate(100, 100)">
    <!-- Echo + Flow Mark -->
    <g transform="translate(0, 4)" fill="none" stroke="#f5f5f5" stroke-linecap="round">
      <path
        d="M8 28 C18 12, 32 12, 42 28"
        stroke-width="4"
      />
      <path
        d="M8 28 C18 44, 32 44, 42 28"
        stroke-width="4"
      />
      <circle
        cx="25"
        cy="28"
        r="4"
        fill="#f5f5f5"
        stroke="none"
      />
    </g>

    <!-- Logo Text -->
    <text
      x="70"
      y="42"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="38"
      font-weight="700"
      fill="#f5f5f5"
      letter-spacing="-1"
    >
      ECOW
    </text>

    <!-- Brand Meaning -->
    <text
      x="72"
      y="68"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="13"
      font-weight="500"
      fill="#666666"
      letter-spacing="3"
    >
      ECHO + FLOW
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 250)">
    <text
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="62"
      font-weight="700"
      fill="#f5f5f5"
      letter-spacing="-2"
    >
      Capture what’s
    </text>

    <text
      y="75"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="62"
      font-weight="700"
      fill="#999999"
      letter-spacing="-2"
    >
      on your mind.
    </text>

    <text
      y="150"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="24"
      fill="#666666"
      font-weight="400"
    >
      A simple space for thoughts, ideas, plans, and everything in between.
    </text>
  </g>
</svg>